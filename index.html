<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>L'Écho du Désir — GitHub Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: { 500: '#f59e0b', 600: '#d97706' },
                        orange: { 500: '#f97316', 600: '#ea580c', 900: '#7c2d12' }
                    }
                }
            }
        }
    </script>
    
    <!-- React 18 & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Urbanist', sans-serif;
            background-color: #050505;
            color: #f1f5f9;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }

        .glow-orange {
            box-shadow: 0 0 30px -5px rgba(234, 88, 12, 0.25);
        }
        .glow-gold {
            box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body class="bg-[#050505] text-slate-100 select-none min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const FORMS = {
            MI_PARCOURS: "https://docs.google.com/forms/d/e/1FAIpQLSdOod0Ty-KTkIkPaRJCHH3ECtpgkI6MZnMv8Tzrg/viewform",
            FINAL: "https://docs.google.com/forms/d/e/1FAIpQLSfRyMUsNqYHLG-e8YMSTgfyPU2RINcGA8/viewform"
        };

        const CHALLENGES = [
            { id: 1, phase: 1, title: "Le Compliment Camouflé", tag: "Subtilité", cost: 1, reward: 2, mission: "Identifier une qualité UNIQUE de l'autre que tu n'as jamais avouée. L'intégrer dans une phrase banale par SMS.", preuve: "Répondre par un seul emoji codé." },
            { id: 2, phase: 1, title: "La Minute du Désir", tag: "Anticipation", cost: 1, reward: 2, mission: "Envoyer une description ultra-précise d'un détail non verbal observé lors de votre toute première rencontre.", preuve: "Audio d'une phrase expliquant pourquoi ce détail était important." },
            { id: 3, phase: 1, title: "La Promesse sous Scellés", tag: "Mystère", cost: 1, reward: 3, mission: "Filme-toi en train d'emballer un objet personnel lentement. Envoie la vidéo sans commentaire.", preuve: "Message décrivant ce que tu feras avec l'objet libéré." },
            { id: 4, phase: 1, title: "Sincérité Spontanée", tag: "Compte à Rebours", cost: 1, reward: 2, mission: "Audio de 10s max : confesser la première chose 'audacieuse' pensée au réveil ce matin.", preuve: "Un mot définissant l'impact (ex: 'Troublant')." },
            { id: 5, phase: 1, title: "Le Désir du Moment", tag: "Connexion", cost: 1, reward: 3, mission: "Phrase : 'Si tu étais là, à cet instant précis, je...' Complète avec une envie sensorielle.", preuve: "Une action concrète en réponse." },
            { id: 6, phase: 2, title: "Focalisation Charnelle", tag: "Macro", cost: 2, reward: 4, mission: "Photo macro d'une zone minuscule et charnelle de ton corps. Esthétique mais ambiguë.", preuve: "Audio de 10s soufflant le nom de la zone." },
            { id: 7, phase: 2, title: "L'Attente Immobile", tag: "Contrôle", cost: 2, reward: 5, mission: "Période de 2h sans toucher physique direct lors de votre prochaine rencontre.", preuve: "Confesser le moment le plus intense." }
        ];

        // Web Audio API pour effets sonores autonomes sans fichiers externes
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;
                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'success') {
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'halt') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(60, now + 0.5);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch (e) {
                // Audio non supporté ou bloqué
            }
        };

        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const [duoCode, setDuoCode] = useState('');
            const [role, setRole] = useState('host'); // 'host' or 'partner'
            const [gameState, setGameState] = useState({
                jd: 20,
                completedIds: [],
                hasFeedbackMid: false,
                hasFeedbackFinal: false,
                lastUpdated: Date.now()
            });
            const [view, setView] = useState('auth'); // auth, sync, dashboard, deck, grimoire, export
            const [activeCard, setActiveCard] = useState(null);
            const [showHalte, setShowHalte] = useState(false);
            const [copied, setCopied] = useState(false);

            // Charger les données sauvegardées
            useEffect(() => {
                const savedCode = localStorage.getItem('echo_gh_duo_code');
                const savedState = localStorage.getItem('echo_gh_game_state');
                const savedRole = localStorage.getItem('echo_gh_role');
                if (savedCode) setDuoCode(savedCode);
                if (savedRole) setRole(savedRole);
                if (savedState) {
                    try {
                        setGameState(JSON.parse(savedState));
                    } catch(e){}
                }
            }, []);

            const saveState = (newState) => {
                const updated = { ...newState, lastUpdated: Date.now() };
                setGameState(updated);
                localStorage.setItem('echo_gh_game_state', JSON.stringify(updated));
            };

            const completeChallenge = (card) => {
                if (gameState.completedIds.includes(card.id)) return;
                playSound('success');
                const newState = {
                    ...gameState,
                    completedIds: [...gameState.completedIds, card.id],
                    jd: gameState.jd + card.reward
                };
                saveState(newState);
                setActiveCard(null);
            };

            const spendJD = (amount) => {
                if (gameState.jd < amount) return false;
                playSound('click');
                const newState = { ...gameState, jd: gameState.jd - amount };
                saveState(newState);
                return true;
            };

            const handleJoin = (code) => {
                playSound('click');
                const cleanCode = code.toUpperCase().trim();
                setDuoCode(cleanCode);
                localStorage.setItem('echo_gh_duo_code', cleanCode);
                setView('dashboard');
            };

            const handleCreate = () => {
                playSound('click');
                const newCode = 'ECHO-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                handleJoin(newCode);
            };

            const copyExportPayload = () => {
                const payload = btoa(JSON.stringify({ code: duoCode, state: gameState }));
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(payload);
                } else {
                    const el = document.createElement('textarea');
                    el.value = payload;
                    document.body.appendChild(el);
                    el.select();
                    document.execCommand('copy');
                    document.body.removeChild(el);
                }
                setCopied(true);
                setTimeout(() => setCopied(false), 3000);
            };

            const importPayload = (raw) => {
                try {
                    const data = JSON.parse(atob(raw.trim()));
                    if (data.code && data.state) {
                        setDuoCode(data.code);
                        setGameState(data.state);
                        localStorage.setItem('echo_gh_duo_code', data.code);
                        localStorage.setItem('echo_gh_game_state', JSON.stringify(data.state));
                        playSound('success');
                        setView('dashboard');
                    }
                } catch(e) {
                    alert("Code de synchronisation invalide.");
                }
            };

            if (view === 'auth') {
                return (
                    <div className="min-h-screen bg-black flex flex-col items-center justify-center p-8 text-center relative overflow-hidden">
                        <div className="absolute inset-0 bg-gradient-to-b from-orange-950/20 via-black to-black pointer-events-none" />
                        <div className="w-20 h-20 text-orange-500 mb-8 animate-pulse flex items-center justify-center rounded-full bg-orange-500/10 border border-orange-500/20 glow-orange">
                            <Icon name="flame" className="w-10 h-10 text-orange-500" />
                        </div>
                        <h1 className="text-4xl font-serif italic text-white mb-2 tracking-[0.3em] uppercase">L'Écho</h1>
                        <p className="text-orange-500/80 text-[10px] uppercase tracking-[0.5em] font-bold mb-4">Du Désir</p>
                        <p className="text-slate-500 text-xs max-w-xs mb-12 font-light">
                            Expérience privée hébergée sur GitHub Pages. Rituel d'ascension pour duo.
                        </p>
                        <div className="space-y-4 w-full max-w-xs z-10">
                            <button 
                                onClick={() => { playSound('click'); setView(duoCode ? 'dashboard' : 'sync'); }} 
                                className="w-full py-5 bg-white text-black rounded-full font-bold uppercase text-[11px] tracking-widest active:scale-95 transition-all shadow-xl shadow-white/10"
                            >
                                {duoCode ? 'Reprendre le Rituel' : 'Inaugurer le Duo'}
                            </button>
                        </div>
                        <div className="mt-16 text-[9px] text-slate-700 tracking-widest uppercase font-mono">
                            GitHub Pages Edition • Serverless & Private
                        </div>
                    </div>
                );
            }

            if (view === 'sync') {
                return <SyncView onJoin={handleJoin} onCreate={handleCreate} onImport={importPayload} />;
            }

            return (
                <div className="flex flex-col min-h-screen bg-[#050505] text-slate-100 font-sans max-w-md mx-auto relative border-x border-white/5 shadow-2xl">
                    
                    {/* Header */}
                    <header className="px-6 pt-10 pb-6 flex justify-between items-center bg-gradient-to-b from-black via-black/80 to-transparent sticky top-0 z-30 backdrop-blur-md border-b border-white/5">
                        <button onClick={() => { playSound('click'); setView('grimoire'); }} className="p-3 bg-white/5 rounded-2xl border border-white/10 text-orange-500 active:scale-90 transition-transform">
                            <Icon name="book-open" className="w-5 h-5" />
                        </button>
                        <div className="text-center">
                            <h1 className="text-sm font-serif italic tracking-[0.3em] uppercase text-white">L'Écho</h1>
                            <p className="text-[9px] tracking-[0.2em] text-orange-500/80 uppercase font-mono">{duoCode || 'Duo Privé'}</p>
                        </div>
                        <div className="bg-gradient-to-r from-amber-500/10 to-orange-500/10 border border-amber-500/20 px-4 py-2 rounded-2xl flex items-center gap-2 glow-gold">
                            <Icon name="coins" className="w-4 h-4 text-amber-500" />
                            <span className="text-lg font-bold tabular-nums text-amber-400">{gameState.jd} <span className="text-[10px] text-amber-500/70 font-mono">JD</span></span>
                        </div>
                    </header>

                    <main className="flex-1 overflow-y-auto px-6 pt-6 pb-36">
                        {view === 'dashboard' && (
                            <div className="space-y-6">
                                <section className="space-y-4">
                                    <PhaseItem 
                                        number="1" 
                                        title="L'Écho de la Subtilité" 
                                        subtitle="5 Défis • Flirt & Anticipation"
                                        status="active" 
                                        progress={(gameState.completedIds.filter(id => id <= 5).length / 5) * 100}
                                        onClick={() => { playSound('click'); setView('deck'); }}
                                    />

                                    <FormItem 
                                        title="Feedback Mi-Parcours"
                                        description="Formulaire requis après 5 défis"
                                        status={gameState.completedIds.filter(id => id <= 5).length >= 5 ? (gameState.hasFeedbackMid ? 'completed' : 'urgent') : 'locked'}
                                        link={FORMS.MI_PARCOURS}
                                        onDone={() => { playSound('success'); saveState({...gameState, hasFeedbackMid: true}); }}
                                    />

                                    <PhaseItem 
                                        number="2" 
                                        title="L'Audace de l'Abandon" 
                                        subtitle="2 Défis Charnels • Déverrouillage après Formulaire 1"
                                        status={gameState.hasFeedbackMid ? "active" : "locked"}
                                        onClick={() => { if(gameState.hasFeedbackMid) { playSound('click'); setView('deck'); } }}
                                    />

                                    <FormItem 
                                        title="Rapport Final"
                                        description="Bilan & Clôture du Rituel"
                                        status={gameState.completedIds.length >= 7 ? (gameState.hasFeedbackFinal ? 'completed' : 'urgent') : 'locked'}
                                        link={FORMS.FINAL}
                                        onDone={() => { playSound('success'); saveState({...gameState, hasFeedbackFinal: true}); }}
                                    />
                                </section>

                                {/* Sync Status Card */}
                                <div className="p-6 rounded-[2rem] border border-white/10 bg-white/[0.02] space-y-3">
                                    <div className="flex justify-between items-center">
                                        <span className="text-[10px] uppercase tracking-widest text-orange-500 font-bold flex items-center gap-2">
                                            <Icon name="refresh-cw" className="w-3 h-3 animate-spin text-orange-500" /> Synchro GitHub Duo
                                        </span>
                                        <button onClick={() => setView('export')} className="text-[10px] text-slate-400 underline uppercase tracking-widest">Partager / Synchro</button>
                                    </div>
                                    <p className="text-[11px] text-slate-400 leading-relaxed italic">
                                        Vos Jetons (JD) et vos cartes validées sont conservés sur votre appareil. Utilisez le bouton de partage pour transmettre la progression à votre partenaire.
                                    </p>
                                </div>
                            </div>
                        )}

                        {view === 'deck' && (
                            <div className="space-y-6">
                                <button onClick={() => setView('dashboard')} className="text-[10px] font-bold uppercase tracking-widest text-slate-500 flex items-center gap-2 mb-4">
                                    <Icon name="chevron-left" className="w-4 h-4" /> Retour au Tableau de Bord
                                </button>
                                <h2 className="text-3xl font-serif italic text-white mb-6">Les Cartes du Désir</h2>
                                <div className="grid gap-4">
                                    {CHALLENGES.map(card => {
                                        const isLocked = (card.phase === 2 && !gameState.hasFeedbackMid);
                                        const isDone = gameState.completedIds.includes(card.id);
                                        return (
                                            <button 
                                                key={card.id}
                                                disabled={isLocked}
                                                onClick={() => { playSound('click'); setActiveCard(card); }}
                                                className={`w-full text-left p-6 rounded-[2rem] border transition-all ${
                                                    isDone ? 'bg-emerald-500/5 border-emerald-500/20 opacity-60' :
                                                    isLocked ? 'opacity-20 border-white/5 bg-transparent cursor-not-allowed' : 'bg-white/[0.03] border-white/10 active:scale-[0.98] hover:border-orange-500/30'
                                                }`}
                                            >
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="text-[9px] font-bold text-orange-500 uppercase tracking-widest">{isLocked ? 'Verrouillé' : card.tag}</span>
                                                    {isDone ? (
                                                        <span className="flex items-center gap-1 text-emerald-400 text-xs font-bold"><Icon name="check-circle-2" className="w-4 h-4" /> Accomplie</span>
                                                    ) : (
                                                        <span className="text-amber-400 font-bold text-[11px] bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">Coût: {card.cost} JD | +{card.reward} JD</span>
                                                    )}
                                                </div>
                                                <h3 className="text-lg font-bold text-white mb-1">{card.title}</h3>
                                                <p className="text-xs text-slate-400 font-light line-clamp-1">{card.mission}</p>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {view === 'export' && (
                            <ExportSyncView 
                                duoCode={duoCode} 
                                gameState={gameState} 
                                onCopy={copyExportPayload} 
                                copied={copied}
                                onImport={importPayload}
                                onBack={() => setView('dashboard')}
                            />
                        )}

                        {view === 'grimoire' && <GrimoireView onClose={() => setView('dashboard')} />}
                    </main>

                    {/* Footer Sécurité */}
                    <footer className="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black via-black/90 to-transparent max-w-md mx-auto z-20">
                        <button 
                            onClick={() => { playSound('halt'); setShowHalte(true); }}
                            className="w-full bg-red-950/40 border border-red-500/30 text-red-400 py-4 rounded-2xl font-bold text-[10px] tracking-[0.3em] uppercase flex items-center justify-center gap-2 active:scale-95 transition-all shadow-lg shadow-red-950/50"
                        >
                            <Icon name="alert-triangle" className="w-4 h-4 text-red-500" /> Serment de Halte (Pause Immédiate)
                        </button>
                    </footer>

                    {/* Modals */}
                    {activeCard && (
                        <CardModal 
                            card={activeCard} 
                            canAfford={gameState.jd >= activeCard.cost || gameState.completedIds.includes(activeCard.id)}
                            onStart={() => spendJD(activeCard.cost)}
                            onComplete={() => completeChallenge(activeCard)} 
                            onClose={() => setActiveCard(null)} 
                            isDone={gameState.completedIds.includes(activeCard.id)}
                        />
                    )}
                    {showHalte && <HalteModal onClose={() => setShowHalte(false)} />}
                </div>
            );
        };

        const SyncView = ({ onJoin, onCreate, onImport }) => {
            const [inputCode, setInputCode] = useState('');
            const [importText, setImportText] = useState('');

            return (
                <div className="min-h-screen bg-[#050505] p-8 flex flex-col justify-center max-w-md mx-auto space-y-8">
                    <div>
                        <h2 className="text-3xl font-serif italic text-white mb-2">Initialisation</h2>
                        <p className="text-slate-500 text-xs">Synchronisez votre jeu entre vos deux téléphones.</p>
                    </div>

                    <div className="space-y-6">
                        <div className="p-6 bg-white/[0.03] border border-white/10 rounded-[2rem] space-y-4">
                            <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold block text-center">Option 1 : Saisir le Code Duo</label>
                            <input 
                                type="text" 
                                placeholder="ECHO-XXXX"
                                value={inputCode}
                                onChange={(e) => setInputCode(e.target.value.toUpperCase())}
                                className="w-full bg-black border border-white/20 rounded-2xl py-4 text-center text-xl font-bold tracking-widest text-orange-500 focus:border-orange-500 outline-none transition-all uppercase"
                            />
                            <button 
                                disabled={inputCode.length < 5}
                                onClick={() => onJoin(inputCode)}
                                className="w-full bg-white text-black py-4 rounded-2xl font-bold uppercase text-xs tracking-widest disabled:opacity-20 active:scale-95 transition-transform"
                            >
                                Rejoindre la session
                            </button>
                        </div>

                        <div className="p-6 bg-white/[0.03] border border-white/10 rounded-[2rem] space-y-4">
                            <label className="text-[10px] uppercase tracking-widest text-slate-400 font-bold block text-center">Option 2 : Coller un code de synchronisation</label>
                            <textarea 
                                placeholder="Collez ici le jeton transmis par votre partenaire..."
                                value={importText}
                                onChange={(e) => setImportText(e.target.value)}
                                className="w-full bg-black border border-white/20 rounded-2xl p-3 text-center text-xs font-mono text-slate-300 h-20 outline-none"
                            />
                            <button 
                                disabled={!importText.trim()}
                                onClick={() => onImport(importText)}
                                className="w-full bg-orange-600 text-white py-4 rounded-2xl font-bold uppercase text-xs tracking-widest disabled:opacity-20 active:scale-95 transition-transform"
                            >
                                Importer la progression
                            </button>
                        </div>

                        <div className="text-center py-2">
                            <button onClick={onCreate} className="w-full py-5 border border-white/10 rounded-[2rem] text-white font-bold uppercase text-[10px] tracking-widest flex items-center justify-center gap-3 active:bg-white/5">
                                <Icon name="plus" className="w-4 h-4 text-orange-500" /> Créer un nouveau Code Duo
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ExportSyncView = ({ duoCode, gameState, onCopy, copied, onImport, onBack }) => {
            const [importVal, setImportVal] = useState('');
            return (
                <div className="space-y-6 animate-in fade-in">
                    <button onClick={onBack} className="text-[10px] font-bold uppercase tracking-widest text-slate-500 flex items-center gap-2 mb-4">
                        <Icon name="chevron-left" className="w-4 h-4" /> Retour
                    </button>
                    <h2 className="text-2xl font-serif italic text-white">Synchronisation Duo</h2>
                    <p className="text-xs text-slate-400 font-light leading-relaxed">
                        Puisque l'application s'exécute de façon 100% privée sans serveur externe, partagez la clé ci-dessous avec votre partenaire pour transmettre vos points et défis accomplis.
                    </p>

                    <div className="p-6 bg-white/[0.03] border border-white/10 rounded-[2rem] space-y-4">
                        <label className="text-[10px] font-bold uppercase tracking-widest text-orange-500">Exporter ma progression actuelle</label>
                        <button 
                            onClick={onCopy}
                            className="w-full py-4 bg-orange-600 text-white rounded-2xl font-bold uppercase text-[10px] tracking-widest flex items-center justify-center gap-2 active:scale-95 transition-transform"
                        >
                            <Icon name="copy" className="w-4 h-4" /> {copied ? 'Code copié dans le presse-papier !' : 'Copier la clé de synchro'}
                        </button>
                    </div>

                    <div className="p-6 bg-white/[0.03] border border-white/10 rounded-[2rem] space-y-4">
                        <label className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Recevoir la progression de l'autre</label>
                        <textarea 
                            value={importVal}
                            onChange={(e) => setImportVal(e.target.value)}
                            placeholder="Coller la clé reçue de votre partenaire..."
                            className="w-full bg-black border border-white/20 rounded-2xl p-3 text-xs font-mono text-slate-300 h-24 outline-none"
                        />
                        <button 
                            disabled={!importVal.trim()}
                            onClick={() => onImport(importVal)}
                            className="w-full py-4 bg-white text-black rounded-2xl font-bold uppercase text-[10px] tracking-widest disabled:opacity-20 active:scale-95 transition-transform"
                        >
                            Mettre à jour mon jeu
                        </button>
                    </div>
                </div>
            );
        };

        const CardModal = ({ card, canAfford, onStart, onComplete, onClose, isDone }) => {
            const [step, setStep] = useState(isDone ? 'mission' : 'intro');

            return (
                <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col p-6 max-w-md mx-auto">
                    <div className="flex-1 flex flex-col justify-center my-auto">
                        <div className="bg-[#111] border border-orange-500/30 rounded-[2.5rem] p-8 relative shadow-2xl">
                            <div className="flex justify-between items-center mb-6">
                                <span className="text-[10px] font-bold text-orange-500 uppercase tracking-[0.3em]">{card.tag}</span>
                                {!isDone && <span className="text-amber-400 font-bold text-xs bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">-{card.cost} JD</span>}
                            </div>

                            <h2 className="text-2xl font-serif text-white mb-6 italic">"{card.title}"</h2>

                            {step === 'intro' ? (
                                <div className="space-y-6">
                                    <p className="text-slate-300 text-xs leading-relaxed font-light">
                                        Révéler cette carte coûte <strong className="text-amber-400">{card.cost} Jetons (JD)</strong>. En validant la réussite de la preuve avec votre partenaire, vous regagnerez <strong className="text-emerald-400">+{card.reward} JD</strong> dans votre trésor commun.
                                    </p>
                                    {!canAfford && (
                                        <div className="p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-[10px] font-bold uppercase tracking-widest text-center">
                                            Trésor de Jetons insuffisant
                                        </div>
                                    )}
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-[9px] uppercase font-bold text-slate-500 tracking-[0.2em] block mb-2">La Mission</label>
                                        <p className="text-base text-slate-100 leading-relaxed font-light">{card.mission}</p>
                                    </div>
                                    <div className="pt-4 border-t border-white/10">
                                        <label className="text-[9px] uppercase font-bold text-orange-500/80 tracking-[0.2em] block mb-2">La Preuve attendue</label>
                                        <p className="text-xs text-orange-200/80 italic leading-relaxed">{card.preuve}</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="space-y-3 pt-6">
                        {step === 'intro' ? (
                            <button 
                                disabled={!canAfford}
                                onClick={() => { onStart(); setStep('mission'); }}
                                className="w-full bg-orange-600 text-white py-4 rounded-2xl font-bold uppercase text-[10px] tracking-widest disabled:opacity-30 active:scale-95 transition-transform"
                            >
                                Invoquer la Carte (-{card.cost} JD)
                            </button>
                        ) : (
                            <button 
                                onClick={onComplete}
                                className="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold uppercase text-[10px] tracking-widest active:scale-95 transition-transform"
                            >
                                Valider la Réalisation (+{card.reward} JD)
                            </button>
                        )}
                        <button onClick={onClose} className="w-full text-slate-500 py-2 text-[10px] font-bold uppercase tracking-widest">Fermer</button>
                    </div>
                </div>
            );
        };

        const PhaseItem = ({ number, title, subtitle, status, progress, onClick }) => (
            <button onClick={onClick} className={`w-full p-5 rounded-[2rem] border transition-all text-left flex items-center gap-4 ${
                status === 'active' ? 'bg-white text-black border-white shadow-xl hover:scale-[1.01]' : 'bg-transparent border-white/5 opacity-30 cursor-not-allowed'
            }`}>
                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center font-serif text-lg font-bold shrink-0 ${status === 'active' ? 'bg-black text-white' : 'bg-white/10'}`}>{number}</div>
                <div className="flex-1 min-w-0">
                    <h3 className="font-bold text-xs tracking-tight truncate">{title}</h3>
                    <p className="text-[10px] opacity-70 truncate font-light">{subtitle}</p>
                    {status === 'active' && progress !== undefined && (
                        <div className="mt-2 h-1 bg-black/10 rounded-full overflow-hidden w-full">
                            <div className="bg-orange-500 h-full transition-all duration-700" style={{width: `${progress}%`}}></div>
                        </div>
                    )}
                </div>
                <Icon name="chevron-right" className="w-4 h-4 opacity-40 shrink-0" />
            </button>
        );

        const FormItem = ({ title, description, status, link, onDone }) => {
            const isLocked = status === 'locked';
            const isCompleted = status === 'completed';
            return (
                <div className={`w-full p-5 rounded-[2rem] border transition-all ${
                    isCompleted ? 'bg-emerald-500/5 border-emerald-500/20' :
                    status === 'urgent' ? 'bg-orange-600 border-orange-600 shadow-lg shadow-orange-600/20' : 'bg-white/5 border-white/5'
                } ${isLocked ? 'opacity-30' : ''}`}>
                    <div className="flex justify-between items-center mb-2">
                        <div>
                            <h3 className={`font-bold text-xs ${isCompleted ? 'text-emerald-400' : 'text-white'}`}>{title}</h3>
                            <p className="text-[9px] text-slate-400 uppercase tracking-tight">{description}</p>
                        </div>
                        {isCompleted ? <Icon name="check-circle-2" className="text-emerald-400 w-5 h-5" /> : isLocked ? <Icon name="lock" className="text-slate-600 w-4 h-4" /> : <Icon name="clipboard-check" className="text-white w-5 h-5" />}
                    </div>
                    {!isLocked && !isCompleted && (
                        <div className="space-y-2 mt-4">
                            <a href={link} target="_blank" rel="noreferrer" className="block text-center py-3 bg-white/10 rounded-xl text-[9px] font-bold uppercase tracking-widest text-white hover:bg-white/20">Ouvrir le formulaire Google</a>
                            <button onClick={onDone} className="w-full py-3 bg-white text-black rounded-xl text-[9px] font-bold uppercase tracking-widest active:scale-95 transition-transform">Confirmer l'envoi du formulaire</button>
                        </div>
                    )}
                </div>
            );
        };

        const GrimoireView = ({ onClose }) => (
            <div className="fixed inset-0 z-50 bg-[#050505] p-6 overflow-y-auto max-w-md mx-auto space-y-8">
                <div className="flex justify-between items-center">
                    <h2 className="text-2xl font-serif italic text-white">Le Grimoire & Éthique</h2>
                    <button onClick={onClose} className="p-2 bg-white/10 rounded-full"><Icon name="x" className="w-4 h-4" /></button>
                </div>
                <div className="space-y-6">
                    <section className="space-y-2">
                        <h4 className="text-orange-500 text-[10px] font-bold uppercase tracking-widest">1. Le Serment de Confiance</h4>
                        <p className="text-xs text-slate-300 leading-relaxed font-light">
                            Chaque défi est une invitation, jamais une contrainte. L'autre demeure libre de refuser ou d'adapter.
                        </p>
                    </section>
                    <section className="space-y-2">
                        <h4 className="text-orange-500 text-[10px] font-bold uppercase tracking-widest">2. Confidentialité GitHub Pages</h4>
                        <p className="text-xs text-slate-300 leading-relaxed font-light">
                            L'application fonctionne à 100% dans le navigateur de votre téléphone. Aucun serveur intermédiaire ne stocke vos photos, audios ou messages.
                        </p>
                    </section>
                    <section className="space-y-2">
                        <h4 className="text-orange-500 text-[10px] font-bold uppercase tracking-widest">3. Le Trésor de Jetons (JD)</h4>
                        <p className="text-xs text-slate-300 leading-relaxed font-light">
                            Révéler un défi consomme des JD. La réalisation effective réapprovisionne votre trésor.
                        </p>
                    </section>
                </div>
                <button onClick={onClose} className="w-full bg-white text-black py-4 rounded-xl font-bold uppercase text-[10px] tracking-widest">Retour au jeu</button>
            </div>
        );

        const HalteModal = ({ onClose }) => (
            <div className="fixed inset-0 z-50 bg-red-950/98 backdrop-blur-xl p-8 flex items-center justify-center max-w-md mx-auto">
                <div className="text-center space-y-6">
                    <div className="w-16 h-16 rounded-full bg-red-500/20 border border-red-500/40 flex items-center justify-center mx-auto text-red-500 animate-pulse">
                        <Icon name="alert-triangle" className="w-8 h-8" />
                    </div>
                    <h2 className="text-3xl font-serif font-bold text-white italic">Serment de Halte</h2>
                    <p className="text-red-100/80 leading-relaxed text-xs font-light">
                        L'expérience est immédiatement mise en pause. Prenez un instant pour communiquer directement, dans la bienveillance et le calme.
                    </p>
                    <button onClick={onClose} className="w-full bg-white text-red-950 py-4 rounded-2xl font-bold uppercase text-[10px] tracking-widest active:scale-95 transition-transform">
                        Reprendre l'expérience en confiance
                    </button>
                </div>
            </div>
        );

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
